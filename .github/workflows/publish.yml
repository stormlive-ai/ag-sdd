name: CI & Publish

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish with --dry-run (no actual publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test suite
        run: node --test tests/cli.test.mjs tests/boundary-guard.test.mjs

      - name: Verify CLI engine
        run: node bin/cli.mjs help

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Extract package version
        id: pkg
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $PKG_VERSION"

      - name: Check if version is already published on npm
        id: check_npm
        run: |
          PKG_VERSION="${{ steps.pkg.outputs.version }}"
          if npm view "ag-sdd@$PKG_VERSION" version > /dev/null 2>&1; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Version $PKG_VERSION is already published on npm. Skipping publish."
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "🚀 Version $PKG_VERSION is not published yet. Ready to publish!"
          fi

      - name: Publish (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: github.event.inputs.dry_run != 'true' && steps.check_npm.outputs.already_published != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
